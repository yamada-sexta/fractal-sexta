name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  APP_ID: io.github.yamada_sexta.FractalSexta
  RUST_NIGHTLY_VERSION: '2026-08-24'
  CARGO_BUILD_JOBS: '2'

jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          workspaces: hooks/checks -> target
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2
        with:
          tool: cargo-binstall
      - name: Install pinned workflow validator
        run: |
          mkdir -p "$RUNNER_TEMP/actionlint-bin"
          curl --fail --location --silent --show-error \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            -o "$RUNNER_TEMP/actionlint.tar.gz"
          printf '%s  %s\n' 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8 \
            "$RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check
          tar -xf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP/actionlint-bin" actionlint
          echo "$RUNNER_TEMP/actionlint-bin" >> "$GITHUB_PATH"
      - name: Repository checks
        run: cargo run --locked --manifest-path hooks/checks/Cargo.toml -- --verbose --force-install --cargo-binstall
      - name: Workflow and shell validation
        run: |
          actionlint
          shellcheck .github/scripts/*.sh
      - name: License and repository publication checks
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak ostree
          pipx run reuse lint
          bash .github/scripts/test-publish-flatpak.sh

  tests:
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/gtk-rs/gtk4-rs/gtk4:latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install build and test dependencies
        id: native-sdk
        run: |
          dnf install -y glycin-gtk4-devel gstreamer1-plugins-bad-free-devel gtksourceview5-devel \
            libshumate-devel libadwaita-devel libwebp-devel sqlite-devel dbus-daemon mutter
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          "$HOME/.cargo/bin/rustup" component add clippy
          version=$(rpm -qa | sort | sha256sum | cut -d' ' -f1)
          echo "cache_version=$version" >> "$GITHUB_OUTPUT"
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2
        with:
          tool: cargo-nextest,grass
      - name: Cache native Rust dependencies
        uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        env:
          CARGO_HOME: ${{ github.workspace }}/_build/cargo-home
        with:
          key: ${{ steps.native-sdk.outputs.cache_version }}
          workspaces: . -> _build/cargo-target
          cache-bin: false
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Configure and check source formatting
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          meson setup _build
          blueprint-compiler format src
          meson format --check-only --recursive
          git -C "$GITHUB_WORKSPACE" diff --exit-code
      - name: Clippy
        run: |
          CARGO_HOME="$PWD/_build/cargo-home" CARGO_TARGET_DIR="$PWD/_build/cargo-target" \
            cargo clippy --locked --all-targets -- -D warnings
      - name: Rust tests under headless Wayland
        run: |
          XDG_RUNTIME_DIR=$(mktemp -d)
          export XDG_RUNTIME_DIR
          dbus-run-session -- mutter --headless --wayland --no-x11 --virtual-monitor 1024x768 -- \
            meson compile -C _build src/cargo-test
      - name: Build developer documentation
        run: |
          rustup toolchain install "nightly-$RUST_NIGHTLY_VERSION" --profile minimal --component rust-docs
          RUSTUP_TOOLCHAIN="nightly-$RUST_NIGHTLY_VERSION" meson compile -C _build src/cargo-doc
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: test-results
          path: _build/src/junit.xml
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: developer-docs
          path: _build/src/doc

  flatpak:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install Flatpak tooling
        run: |
          # Free the hosted runner's unused mobile and .NET SDK space for Rust builds.
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder ostree appstream desktop-file-utils
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak remote-add --user --if-not-exists gnome-nightly https://nightly.gnome.org/gnome-nightly.flatpakrepo
      - name: Prepare rolling release manifest
        run: |
          mkdir -p "$RUNNER_TEMP/fractal-cargo-cache"
          jq --arg id "$APP_ID" --arg version "sexta.${GITHUB_RUN_NUMBER}.${GITHUB_SHA:0:12}" \
            --arg cache "$RUNNER_TEMP/fractal-cargo-cache" '
            .id = $id |
            .branch = "nightly" |
            .modules[-1]["config-opts"] = ["-Dprofile=default", "-Dversion-suffix=" + $version,
              "-Dcargo-cache-dir=" + $cache] |
            .modules[-1]["build-options"]["build-args"] = ["--filesystem=" + $cache] |
            .["build-options"].env.CARGO_BUILD_JOBS = "2" |
            .["build-options"].env.CARGO_PROFILE_RELEASE_DEBUG = "false"
          ' build-aux/io.github.yamada_sexta.FractalSexta.Devel.json > build-aux/fractal-sexta-nightly.json
      - name: Install SDK and identify cache version
        id: sdk
        run: |
          flatpak-builder --user --assumeyes --install-deps-only \
            --install-deps-from=gnome-nightly --install-deps-from=flathub \
            flatpak_app build-aux/fractal-sexta-nightly.json
          version=$(flatpak list --user --runtime --columns=ref,active | sort | sha256sum | cut -d' ' -f1)
          echo "cache_version=$version" >> "$GITHUB_OUTPUT"
      - name: Cache Flatpak Cargo dependencies and build outputs
        id: cargo-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/fractal-cargo-cache
          key: flatpak-cargo-${{ runner.os }}-${{ steps.sdk.outputs.cache_version }}-${{ hashFiles('Cargo.lock', '.cargo/config.toml') }}-${{ github.sha }}
          restore-keys: |
            flatpak-cargo-${{ runner.os }}-${{ steps.sdk.outputs.cache_version }}-${{ hashFiles('Cargo.lock', '.cargo/config.toml') }}-
            flatpak-cargo-${{ runner.os }}-${{ steps.sdk.outputs.cache_version }}-
      - name: Cache Flatpak dependency modules and downloads
        id: builder-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            .flatpak-builder/cache
            .flatpak-builder/downloads
            .flatpak-builder/git
          key: flatpak-builder-${{ runner.os }}-${{ steps.sdk.outputs.cache_version }}-${{ hashFiles('build-aux/*.json') }}-${{ github.sha }}
          restore-keys: |
            flatpak-builder-${{ runner.os }}-${{ steps.sdk.outputs.cache_version }}-
      - name: Build x86_64 Flatpak
        run: |
          flatpak-builder --user --assumeyes --disable-rofiles-fuse --force-clean --rebuild-on-sdk-change --jobs=2 \
            --install-deps-from=gnome-nightly --install-deps-from=flathub \
            --repo=repo --subject="Fractal Sexta $GITHUB_SHA" \
            flatpak_app build-aux/fractal-sexta-nightly.json
      - name: Save Flatpak Cargo cache
        if: steps.cargo-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/fractal-cargo-cache
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}
      - name: Save Flatpak builder cache
        if: steps.builder-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            .flatpak-builder/cache
            .flatpak-builder/downloads
            .flatpak-builder/git
          key: ${{ steps.builder-cache.outputs.cache-primary-key }}
      - name: Validate exported Flatpak
        run: |
          docker run --rm -v "$PWD:/work" -w /work \
            ghcr.io/flathub/flatpak-builder-lint:latest \
            --exceptions --user-exceptions .github/flatpak-builder-lint-exceptions.json repo repo
          ostree --repo=repo export --subpath=files/share/metainfo "app/$APP_ID/x86_64/nightly" \
            | tar -x "$APP_ID.metainfo.xml"
          appstreamcli validate --pedantic --explain --strict "$APP_ID.metainfo.xml"
      - name: Archive repository
        run: tar -cf flatpak-repo.tar repo
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: flatpak-repository
          path: flatpak-repo.tar
          retention-days: 7

  publish:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [checks, tests, flatpak]
    runs-on: ubuntu-24.04
    concurrency:
      group: flatpak-publication
      cancel-in-progress: false
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Skip superseded commits
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq '.sha')
          if [[ "$latest" == "$GITHUB_SHA" ]]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: steps.current.outputs.publish == 'true'
        with:
          name: flatpak-repository
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
        if: steps.current.outputs.publish == 'true'
        id: pages
      - name: Sign and prepare the Flatpak repository
        if: steps.current.outputs.publish == 'true'
        env:
          FLATPAK_GPG_PRIVATE_KEY: ${{ secrets.FLATPAK_GPG_PRIVATE_KEY }}
          FLATPAK_GPG_FINGERPRINT: ${{ vars.FLATPAK_GPG_FINGERPRINT }}
          PAGES_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak ostree
          GNUPGHOME=$(mktemp -d)
          export GNUPGHOME
          trap 'gpgconf --kill gpg-agent; rm -rf "$GNUPGHOME"' EXIT
          test -n "$FLATPAK_GPG_PRIVATE_KEY"
          printf '%s\n' "$FLATPAK_GPG_PRIVATE_KEY" | gpg --batch --import
          unset FLATPAK_GPG_PRIVATE_KEY
          tar -xf flatpak-repo.tar
          bash .github/scripts/publish-flatpak.sh repo _site "$PAGES_URL"
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        if: steps.current.outputs.publish == 'true'
        with:
          path: _site
      - uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
        if: steps.current.outputs.publish == 'true'
        id: deployment
