name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'screenshots/**'
      - '.gitlab/**'
      - '.gitlab-ci.yml'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'screenshots/**'
      - '.gitlab/**'
      - '.gitlab-ci.yml'
  workflow_dispatch:
    inputs:
      publish_run_id:
        description: Publish an existing successful main build without rebuilding
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_ID: io.github.yamada_sexta.FractalSexta
  CARGO_BUILD_JOBS: '4'
  RUST_RELEASE_TOOLCHAIN: nightly-2026-08-24

jobs:
  flatpak:
    if: inputs.publish_run_id == ''
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Flatpak tooling
        run: |
          # Free the hosted runner's unused mobile and .NET SDK space for Rust builds.
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder ostree appstream desktop-file-utils xvfb xauth dbus-x11
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak remote-add --user --if-not-exists gnome-nightly https://nightly.gnome.org/gnome-nightly.flatpakrepo
      - name: Cache release Rust toolchain
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/fractal-rust-toolchain
          key: release-rust-${{ runner.os }}-${{ runner.arch }}-${{ env.RUST_RELEASE_TOOLCHAIN }}
      - name: Prepare release Rust toolchain
        id: rust
        env:
          RUSTUP_HOME: ${{ runner.temp }}/fractal-rust-toolchain
        run: |
          rustup toolchain install "$RUST_RELEASE_TOOLCHAIN" --profile minimal --no-self-update
          toolchain=$(dirname "$(dirname "$(rustup which --toolchain "$RUST_RELEASE_TOOLCHAIN" cargo)")")
          "$toolchain/bin/rustc" --version
          echo "path=$toolchain" >> "$GITHUB_OUTPUT"
      - name: Prepare rolling release manifest
        run: |
          mkdir -p "$RUNNER_TEMP/fractal-cargo-cache"
          jq --arg id "$APP_ID" --arg version "sexta.${GITHUB_RUN_NUMBER}.${GITHUB_SHA:0:12}" \
            --arg cache "$RUNNER_TEMP/fractal-cargo-cache" --arg toolchain "${{ steps.rust.outputs.path }}" '
            .id = $id |
            .branch = "nightly" |
            .modules[-1]["run-tests"] = true |
            .modules[-1]["test-rule"] = "cargo-test-ci" |
            .modules[-1]["build-options"]["test-args"] = ["--socket=x11", "--share=network",
              "--filesystem=" + $cache, "--filesystem=" + $toolchain + ":ro",
              "--env=PATH=" + $toolchain + "/bin:/app/bin:/usr/bin:/bin:/usr/lib/sdk/rust-stable/bin"] |
            .modules[-1]["build-options"].env.GDK_BACKEND = "x11" |
            .modules[-1]["build-options"].env.GSK_RENDERER = "gl" |
            .modules[-1]["build-options"].env.GTK_A11Y = "none" |
            .modules[-1]["config-opts"] = ["-Dprofile=default", "-Dversion-suffix=" + $version,
              "-Dcargo-cache-dir=" + $cache] |
            .modules[-1]["build-options"]["build-args"] = ["--share=network", "--filesystem=" + $cache,
              "--filesystem=" + $toolchain + ":ro"] |
            .modules[-1]["build-options"]["prepend-path"] = $toolchain + "/bin" |
            .modules[-1]["build-options"].env.RUSTFLAGS = (.["build-options"].env.RUSTFLAGS +
              " -Zshare-generics=y -Zthreads=4") |
            .modules[-1]["build-options"].env.CARGO_PROFILE_RELEASE_LTO = "off" |
            .["build-options"].env.CARGO_BUILD_JOBS = "4" |
            .["build-options"].env.CARGO_PROFILE_RELEASE_DEBUG = "false" |
            .["build-options"].env.CARGO_PROFILE_RELEASE_LTO = "false" |
            .["build-options"].env.CARGO_PROFILE_RELEASE_CODEGEN_UNITS = "16" |
            .["build-options"].env.CARGO_PROFILE_RELEASE_INCREMENTAL = "true"
          ' build-aux/io.github.yamada_sexta.FractalSexta.Devel.json > build-aux/fractal-sexta-nightly.json
      - name: Install SDK and identify cache version
        id: sdk
        run: |
          flatpak-builder --user --assumeyes --install-deps-only \
            --install-deps-from=gnome-nightly --install-deps-from=flathub \
            flatpak_app build-aux/fractal-sexta-nightly.json
          version=$(flatpak list --user --runtime --columns=ref,active | sort | sha256sum | cut -d' ' -f1)
          echo "cache_version=$version" >> "$GITHUB_OUTPUT"
      - name: Cache Flatpak Cargo dependencies and build outputs
        id: cargo-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/fractal-cargo-cache
          key: flatpak-cargo-${{ runner.os }}-${{ steps.sdk.outputs.cache_version }}-${{ env.RUST_RELEASE_TOOLCHAIN }}-${{ hashFiles('Cargo.lock', '.cargo/config.toml') }}-${{ github.sha }}
          restore-keys: |
            flatpak-cargo-${{ runner.os }}-${{ steps.sdk.outputs.cache_version }}-${{ env.RUST_RELEASE_TOOLCHAIN }}-${{ hashFiles('Cargo.lock', '.cargo/config.toml') }}-
            flatpak-cargo-${{ runner.os }}-${{ steps.sdk.outputs.cache_version }}-${{ env.RUST_RELEASE_TOOLCHAIN }}-
      - name: Cache Flatpak dependency modules and downloads
        id: builder-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .flatpak-builder/cache
            .flatpak-builder/downloads
            .flatpak-builder/git
          key: flatpak-builder-${{ runner.os }}-${{ steps.sdk.outputs.cache_version }}-${{ hashFiles('build-aux/*.json') }}-${{ github.sha }}
          restore-keys: |
            flatpak-builder-${{ runner.os }}-${{ steps.sdk.outputs.cache_version }}-
      - name: Reduce release cache size
        run: |
          mkdir -p "$RUNNER_TEMP/fractal-cargo-cache/home"
          printf '[unstable]\nembed-metadata = true\n' > "$RUNNER_TEMP/fractal-cargo-cache/home/config.toml"
      - name: Build x86_64 Flatpak
        run: |
          xvfb-run --auto-servernum dbus-run-session -- \
            flatpak-builder --user --assumeyes --disable-rofiles-fuse --force-clean --rebuild-on-sdk-change --jobs=4 \
            --install-deps-from=gnome-nightly --install-deps-from=flathub \
            --repo=repo --subject="Fractal Sexta $GITHUB_SHA" \
            flatpak_app build-aux/fractal-sexta-nightly.json
      - name: Save Flatpak Cargo cache
        if: ${{ !cancelled() && steps.sdk.conclusion == 'success' && steps.cargo-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/fractal-cargo-cache
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}
      - name: Save Flatpak builder cache
        if: ${{ !cancelled() && steps.sdk.conclusion == 'success' && steps.builder-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .flatpak-builder/cache
            .flatpak-builder/downloads
            .flatpak-builder/git
          key: ${{ steps.builder-cache.outputs.cache-primary-key }}
      - name: Verify exported repository
        run: |
          ostree --repo=repo fsck
          ostree --repo=repo rev-parse "app/$APP_ID/x86_64/nightly"
      - name: Archive repository
        run: tar -cf flatpak-repo.tar repo
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: flatpak-repository
          path: flatpak-repo.tar
          retention-days: 7

  publish:
    if: >-
      always() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' &&
      (needs.flatpak.result == 'success' ||
       (github.event_name == 'workflow_dispatch' && inputs.publish_run_id != ''))
    needs: [flatpak]
    runs-on: ubuntu-24.04
    concurrency:
      group: flatpak-publication
      cancel-in-progress: false
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Skip superseded commits
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISH_RUN_ID: ${{ inputs.publish_run_id }}
        run: |
          latest=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq '.sha')
          ignored_paths=(':(exclude,glob)**/*.md' ':!screenshots/**' ':!.gitlab/**' ':!.gitlab-ci.yml')
          if [[ -n "$PUBLISH_RUN_ID" ]]; then
            [[ "$PUBLISH_RUN_ID" =~ ^[0-9]+$ ]]
            built=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PUBLISH_RUN_ID" \
              --jq 'select(.conclusion == "success" and .head_branch == "main" and .path == ".github/workflows/ci.yml") | .head_sha')
            test -n "$built"
            git fetch --no-tags origin "$built" "$latest"
            git diff --quiet "$built" "$latest" -- . "${ignored_paths[@]}" ':!.github/workflows/ci.yml'
            echo "publish=true" >> "$GITHUB_OUTPUT"
          elif [[ "$latest" == "$GITHUB_SHA" ]]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            git fetch --no-tags origin "$latest"
            if git diff --quiet "$GITHUB_SHA" "$latest" -- . "${ignored_paths[@]}"; then
              echo "publish=true" >> "$GITHUB_OUTPUT"
            fi
          fi
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: steps.current.outputs.publish == 'true'
        with:
          name: flatpak-repository
          run-id: ${{ inputs.publish_run_id || github.run_id }}
          github-token: ${{ github.token }}
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
        if: steps.current.outputs.publish == 'true'
        id: pages
      - name: Sign and prepare the Flatpak repository
        if: steps.current.outputs.publish == 'true'
        env:
          FLATPAK_GPG_PRIVATE_KEY: ${{ secrets.FLATPAK_GPG_PRIVATE_KEY }}
          FLATPAK_GPG_FINGERPRINT: ${{ vars.FLATPAK_GPG_FINGERPRINT }}
          PAGES_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak ostree
          GNUPGHOME=$(mktemp -d)
          export GNUPGHOME
          trap 'gpgconf --kill gpg-agent; rm -rf "$GNUPGHOME"' EXIT
          test -n "$FLATPAK_GPG_PRIVATE_KEY"
          printf '%s\n' "$FLATPAK_GPG_PRIVATE_KEY" | gpg --batch --import
          unset FLATPAK_GPG_PRIVATE_KEY
          tar -xf flatpak-repo.tar
          bash .github/scripts/publish-flatpak.sh repo _site "$PAGES_URL"
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        if: steps.current.outputs.publish == 'true'
        with:
          path: _site
      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        if: steps.current.outputs.publish == 'true'
        id: deployment
