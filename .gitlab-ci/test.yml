# Tests after the app is built.

include: '.gitlab-ci/utils.yml'

# Validate the metainfo with Flathub's tool.
lint-metainfo:
  stage: test
  image:
    name: "ghcr.io/flathub/flatpak-builder-lint:latest"
    entrypoint: [""]
  variables:
    METAINFO: "${APP_ID}.metainfo.xml"
  interruptible: true
  script:
    # Extract the flatpak repo.
    - tar -xf repo.tar
    # This tool has extra tests on top of appstreamcli and is required to pass for Flathub.
    - flatpak-builder-lint --debug --exceptions --user-exceptions .gitlab-ci/flatpak-builder-lint-exceptions.json repo repo > flatpak-builder-lint-report.json || exit 0
    - cat flatpak-builder-lint-report.json
    # If the report is not empty, fail the job.
    - |-
      if [[ -s flatpak-builder-lint-report.json ]]; then
        exit 1
      fi
    # Extract the metainfo from the flatpak repo.
    - ostree_ref=$(ostree refs --repo=repo --list app/${APP_ID}/x86_64)
    - ostree export --repo=repo --subpath=files/share/metainfo "${ostree_ref}" | tar -x ${METAINFO}
    # Test also with the pedantic and strict flags.
    - appstreamcli validate --pedantic --explain --strict ${METAINFO}
  needs: ["build@x86_64"]

# Run the Rust tests.
rust-tests:
  stage: test
  extends:
    - .dev_image
  script:
    # Install the stable Rust toolchain.
    - curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
    - source $HOME/.cargo/env
    # Install cargo-nextest and grass with cargo-binstall
    - curl -L --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/cargo-bins/cargo-binstall/main/install-from-binstall-release.sh | sh
    - cargo binstall cargo-nextest grass
    # Run the tests with a headless wayland display server.
    - dnf install -y dbus-daemon mutter
    - export XDG_RUNTIME_DIR="$(mktemp -p $(pwd) -d xdg-runtime-XXXXXX)"
    - meson setup _build
    - dbus-run-session --
      mutter --headless --wayland --no-x11 --virtual-monitor 1024x768 --
      meson compile -C _build src/cargo-test
  dependencies: []
  artifacts:
    reports:
      junit: '_build/src/junit.xml'

# Build the docs and make sure that there are no errors.
build-docs:
  stage: test
  extends:
    - .dev_image
  script:
    # Install the nightly Rust toolchain.
    - curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- --default-toolchain none -y
    - source $HOME/.cargo/env
    - rustup toolchain install nightly-${RUST_NIGHTLY_VERSION} --profile minimal --allow-downgrade -c rust-docs
    # Build the docs.
    - meson setup -Dprofile=build-env _build
    - meson compile -C _build src/cargo-doc
    # Bundle the docs in an archive.
    - tar --auto-compress --create --file "${CI_PROJECT_DIR}/${CI_PROJECT_NAME}-docs.tar.gz" --directory "_build/src/doc" .
  dependencies: []
  artifacts:
    paths:
      - ${CI_PROJECT_NAME}-docs.tar.gz
